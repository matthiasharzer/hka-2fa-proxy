name: manual-release.yml
on:
  workflow_dispatch:
    inputs:
      force-bump-version:
        description: "Force bump version (major, minor, patch)"
        required: true
        type: choice
        default: patch
        options:
          - major
          - minor
          - patch
      bump-message:
        description: "Bump message"
        required: true
        type: string
        default: "trigger release"

permissions:
  contents: write

jobs:
  validate-branch:
    name: Validate branch
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check branch
        id: check-branch
        run: |
          if [[ "${{ github.ref_name }}" != "main" ]]; then
            echo "::error title=Branch validation failed::This workflow can only be run on the main branch."
            exit 1
          fi

  force-bump-version:
    name: Force bump version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: validate-branch
    env:
      BUMP_MESSAGE: ${{ github.event.inputs.bump-message }}

    steps:
      - name: Clone repository
        uses: actions/checkout@v7
        with:
          fetch-depth: "0"
      - name: Configure git
        run: |
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"
          git config --global user.name "${{ github.actor }}"
      - name: Create patch version bump
        if: ${{inputs.force-bump-version == 'patch'}}
        run: |
          git commit --allow-empty -m "fix: $BUMP_MESSAGE"
      - name: Create minor version bump
        if: ${{inputs.force-bump-version == 'minor'}}
        run: |
          git commit --allow-empty -m "feat: $BUMP_MESSAGE"
      - name: Create major version bump
        if: ${{inputs.force-bump-version == 'major'}}
        run: |
          git commit --allow-empty -m "feat!: $BUMP_MESSAGE"
      - name: Push changes
        run: |
          git push origin HEAD:main
